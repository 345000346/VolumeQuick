name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  AHK_VERSION: 2.0.19
  AHK_SETUP_EXE: AutoHotkey_2.0.19_setup.exe
  AHK_SETUP_SHA256: fd55129cbd356f49d2151e0a8b9662d90d2dbbb9579cc2410fde38df94787a3a
  AHK2EXE_VERSION: Ahk2Exe1.1.37.02a0a
  AHK2EXE_ZIP: Ahk2Exe1.1.37.02a0.zip
  AHK2EXE_SHA256: 287079ba96dcfa79fa6c568481f4a26bd3ac26671f8a21c4c03ed331657d53c0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: 安装 AutoHotkey v2（固定来源+哈希校验）
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          $installerDir = Join-Path $workspace ".ci-cache/autohotkey"
          $installerPath = Join-Path $installerDir $env:AHK_SETUP_EXE
          $downloadUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$($env:AHK_VERSION)/$($env:AHK_SETUP_EXE)"
          $expectedHash = $env:AHK_SETUP_SHA256.ToLower()

          New-Item -Path $installerDir -ItemType Directory -Force | Out-Null

          $success = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                  Write-Host "开始下载 AutoHotkey（第 $attempt/3 次）：$downloadUrl"
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath -ErrorAction Stop
                  $downloadedHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLower()
                  if ($downloadedHash -ne $expectedHash) {
                      Write-Host "第 $attempt/3 次下载后哈希校验失败。期望：$expectedHash，实际：$downloadedHash"
                      Remove-Item -Path $installerPath -Force -ErrorAction SilentlyContinue
                      if ($attempt -lt 3) {
                          Start-Sleep -Seconds 2
                      }
                      continue
                  }

                  $success = $true
                  Write-Host "AutoHotkey 下载并哈希校验成功。"
                  break
              } catch {
                  Write-Host "第 $attempt/3 次下载失败：$($_.Exception.Message)"
                  if ($attempt -lt 3) {
                      Start-Sleep -Seconds 2
                  }
              }
          }

          if (-not $success) {
              Write-Host "错误：AutoHotkey 下载或哈希校验最终失败。"
              Write-Host "下载地址：$downloadUrl"
              Write-Host "预期哈希：$expectedHash"
              exit 1
          }

          try {
              Start-Process -FilePath $installerPath -ArgumentList '/S' -Wait -NoNewWindow
          } catch {
              Write-Host "错误：AutoHotkey 静默安装失败。"
              Write-Host "异常信息：$($_.Exception.Message)"
              exit 1
          }

      - name: 下载并准备 Ahk2Exe（固定来源+哈希校验）
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          $cacheDir = Join-Path $workspace ".ci-cache/ahk2exe"
          $zipPath = Join-Path $cacheDir $env:AHK2EXE_ZIP
          $extractDir = Join-Path $cacheDir $env:AHK2EXE_VERSION
          $downloadUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$($env:AHK2EXE_VERSION)/$($env:AHK2EXE_ZIP)"
          $expectedHash = $env:AHK2EXE_SHA256.ToLower()

          New-Item -Path $cacheDir -ItemType Directory -Force | Out-Null

          $success = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                  Write-Host "开始下载 Ahk2Exe（第 $attempt/3 次）：$downloadUrl"
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -ErrorAction Stop
                  $downloadedHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
                  if ($downloadedHash -ne $expectedHash) {
                      Write-Host "第 $attempt/3 次下载后哈希校验失败。期望：$expectedHash，实际：$downloadedHash"
                      Remove-Item -Path $zipPath -Force -ErrorAction SilentlyContinue
                      if ($attempt -lt 3) {
                          Start-Sleep -Seconds 2
                      }
                      continue
                  }

                  $success = $true
                  Write-Host "Ahk2Exe 下载并哈希校验成功。"
                  break
              } catch {
                  Write-Host "第 $attempt/3 次下载失败：$($_.Exception.Message)"
                  if ($attempt -lt 3) {
                      Start-Sleep -Seconds 2
                  }
              }
          }

          if (-not $success) {
              Write-Host "错误：Ahk2Exe 下载或哈希校验最终失败。"
              Write-Host "下载地址：$downloadUrl"
              Write-Host "预期哈希：$expectedHash"
              exit 1
          }

          try {
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          } catch {
              Write-Host "错误：Ahk2Exe 解压失败，文件路径：$zipPath"
              Write-Host "异常信息：$($_.Exception.Message)"
              exit 1
          }

          $compilerFile = Get-ChildItem -Path $extractDir -Filter "Ahk2Exe.exe" -Recurse | Select-Object -First 1
          if (-not $compilerFile) {
              Write-Host "错误：Ahk2Exe 解压后未找到 Ahk2Exe.exe，目录：$extractDir"
              exit 1
          }

          "AHK2EXE_PATH=$($compilerFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 编译 AHK 脚本
        shell: pwsh
        run: |
          if (-not $env:AHK2EXE_PATH) {
              throw "缺少 AHK2EXE_PATH 环境变量"
          }

          $baseCandidates = @(
            "C:/Program Files/AutoHotkey/AutoHotkey64.exe",
            "C:/Program Files/AutoHotkey/v2/AutoHotkey64.exe",
            "C:/Program Files/AutoHotkey/AutoHotkey.exe"
          )
          $baseFile = $baseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $baseFile) {
              throw "未找到 AutoHotkey 基础可执行文件"
          }

          $workspace = (Get-Location).Path
          $inputFile = Join-Path $workspace "VolumeHotkey.ahk"
          $outputFile = Join-Path $workspace "VolumeHotkey.exe"

          & "$env:AHK2EXE_PATH" /in "$inputFile" /out "$outputFile" /base "$baseFile"

          if (-not (Test-Path $outputFile)) {
              throw "编译命令执行后未生成输出文件：$outputFile"
          }

          Write-Host "编译完成，输出文件：$outputFile"

      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          $exePath = Join-Path $workspace "VolumeHotkey.exe"
          $shaPath = Join-Path $workspace "VolumeHotkey.sha256"

          if (-not (Test-Path $exePath)) {
              throw "未找到待校验文件：$exePath"
          }

          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  VolumeHotkey.exe" | Out-File -FilePath $shaPath -Encoding utf8
          Write-Host "已生成 SHA256 文件：$shaPath"

      - name: 创建 Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## 校验下载完整性（Windows PowerShell）
            ```powershell
            Get-FileHash .\VolumeHotkey.exe -Algorithm SHA256
            Get-Content .\VolumeHotkey.sha256
            ```
          files: |
            VolumeHotkey.exe
            VolumeHotkey.sha256
          draft: false
          prerelease: false
