name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Generate release metadata
      shell: pwsh
      run: |
        try {
            $date = Get-Date -Format "yyyyMMdd"
            $shortSha = (git rev-parse --short HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw "获取 short SHA 失败" }

            if ($env:GITHUB_REF_TYPE -eq "tag") {
                $tagName = $env:GITHUB_REF_NAME
                $releaseName = $env:GITHUB_REF_NAME
            } else {
                $tagName = "VolumeHotkey-$date-r$($env:GITHUB_RUN_NUMBER)-$shortSha"
                $releaseName = "VolumeHotkey $date (run $($env:GITHUB_RUN_NUMBER), $shortSha)"
            }

            "DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Append
            "TAG_NAME=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append

            $latestCommit = git log -1 --pretty=format:"%s"
            if ($LASTEXITCODE -ne 0) { throw "获取提交信息失败" }
            "COMMIT_MSG=$latestCommit" | Out-File -FilePath $env:GITHUB_ENV -Append

            $allTags = git tag --sort=-creatordate
            if ($LASTEXITCODE -ne 0) { throw "获取标签列表失败" }

            $baseTag = $null
            foreach ($t in $allTags) {
                if ($env:GITHUB_REF_TYPE -eq "tag" -and $t -eq $env:GITHUB_REF_NAME) {
                    continue
                }
                $baseTag = $t
                break
            }

            if ($baseTag) {
                $changes = git log "$baseTag..HEAD" --pretty=format:"- %s"
            } else {
                $changes = git log --pretty=format:"- %s"
            }

            if (-not $changes) {
                $changes = @("- 无新增变更")
            }

            $changesText = ($changes -join "`n")
            "CHANGES<<EOF`n$changesText`nEOF" | Out-File -FilePath $env:GITHUB_ENV -Append
        } catch {
            Write-Host "错误: $_"
            Write-Host "Stack Trace: $($_.ScriptStackTrace)"
            exit 1
        }

    - name: Install AutoHotkey v2
      shell: pwsh
      run: |
        choco install autohotkey --version=2.0.19 -y --no-progress

    - name: Prepare Ahk2Exe
      shell: pwsh
      run: |
        $downloadUrl = ""
        $release = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
        foreach ($asset in $release.assets) {
            if ($asset.name -like "*.zip") {
                $downloadUrl = $asset.browser_download_url
                break
            }
        }

        if (-not $downloadUrl) {
            throw "未找到 Ahk2Exe 压缩包下载地址"
        }

        $zipPath = "$env:RUNNER_TEMP/ahk2exe.zip"
        $extractDir = "$env:RUNNER_TEMP/ahk2exe"
        Invoke-WebRequest $downloadUrl -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

        $compilerFile = Get-ChildItem -Path $extractDir -Filter "Ahk2Exe.exe" -Recurse | Select-Object -First 1
        if (-not $compilerFile) {
            throw "Ahk2Exe 解压后未找到 Ahk2Exe.exe"
        }

        "AHK2EXE_PATH=$($compilerFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Compile AHK Script
      shell: pwsh
      run: |
        if (-not $env:AHK2EXE_PATH) {
            throw "缺少 AHK2EXE_PATH 环境变量"
        }

        $baseCandidates = @(
          "C:/Program Files/AutoHotkey/AutoHotkey64.exe",
          "C:/Program Files/AutoHotkey/v2/AutoHotkey64.exe",
          "C:/Program Files/AutoHotkey/AutoHotkey.exe"
        )
        $baseFile = $baseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $baseFile) {
            throw "未找到 AutoHotkey 基础可执行文件"
        }

        $workspace = (Get-Location).Path
        $inputFile = Join-Path $workspace "VolumeHotkey.ahk"
        $outputFile = Join-Path $workspace "VolumeHotkey.exe"

        & "$env:AHK2EXE_PATH" /in "$inputFile" /out "$outputFile" /base "$baseFile"

        Write-Host "编译命令执行完成，目标输出: $outputFile"

    - name: Create Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}
        body: |
          ## 更新内容
          ${{ env.CHANGES }}
        files: VolumeHotkey.exe
        draft: false
        prerelease: false
